[project]
name = "hackronyx"
version = "0.1.0"
description = "Multi-Temporal Urban Heat Island Analysis & AI Prediction for Nagpur"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "rasterio>=1.3.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "shap>=0.46.0",
    "numba>=0.60.0",
    "llvmlite>=0.43.0",
    "joblib>=1.3.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "shapely>=2.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

